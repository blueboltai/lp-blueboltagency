# Publica a lp-v2/ no GitHub Pages.
#
# FALTA UM PASSO, E TEM DE SER FEITO A MAO, UMA VEZ SO:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Tentei liga-lo daqui e dos dois lados nao da: a API das Pages nao e
# alcancavel do ambiente onde a pagina e construida, e o token com que
# esta Action corre e de uma GitHub App sem direitos de administracao das
# Pages ("Resource not accessible by integration"). Ligar a fonte e coisa
# de um clique; a partir dai isto corre sozinho.
#
# Nota: num repositorio privado as Pages exigem plano pago. Se a conta for
# gratuita, a pagina das definicoes di-lo — e entao ou o repositorio passa
# a publico ou se usa outro alojamento.
#
# So por `workflow_dispatch` ate as Pages estarem ligadas: a correr a cada
# push, falhava sempre e enchia o historico de vermelho. Depois de ligadas,
# basta descomentar o `push:` para voltar a publicar a cada alteracao.
name: Publicar a landing page

on:
  workflow_dispatch:
  # push:
  #   branches: [claude/elementor-to-html-conversion-orrfzj]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Vai para o ar so o que a pagina precisa. O build.py, o README e o
      # export original do Elementor ficam no repositorio, nao no site.
      - name: Preparar o que vai para o ar
        run: |
          mkdir -p site
          cp -r lp-v2/. site/
          rm -rf site/source site/build.py site/README.md
          touch site/.nojekyll
          echo "— o que vai ser publicado —"
          find site -maxdepth 2 -not -path '*/img/testemunhos/*' | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
