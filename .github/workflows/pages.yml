# Publica a lp-v2/ no GitHub Pages a cada push neste ramo.
#
# https://blueboltai.github.io/lp-blueboltagency/
#
# Ligar as Pages exigiu um passo a mao, uma vez so (Settings -> Pages ->
# Source: "GitHub Actions"), e fica registado porque nao e obvio: nem a
# API das Pages e alcancavel do ambiente onde a pagina e construida, nem o
# token com que esta Action corre tem direito a criar o site
# ("Resource not accessible by integration"). Nao era o plano nem a
# visibilidade do repositorio — tentei com ele ja publico e deu o mesmo.
#
# O `enablement: true` fica: uma vez o site criado, so faz um GET e segue.
name: Publicar a landing page

on:
  push:
    branches: [claude/elementor-to-html-conversion-orrfzj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Vai para o ar so o que a pagina precisa. O build.py, o README e o
      # export original do Elementor ficam no repositorio, nao no site.
      - name: Preparar o que vai para o ar
        run: |
          mkdir -p site
          cp -r lp-v2/. site/
          rm -rf site/source site/build.py site/README.md
          # As duas paginas de campanha vao juntas, para se poderem ver
          # antes de subir: /meta/ e /google/ partilham o img/ e o assets/
          # da raiz, por isso nao ha nada a duplicar.
          touch site/.nojekyll
          echo "— o que vai ser publicado —"
          find site -maxdepth 2 -not -path '*/img/testemunhos/*' | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
