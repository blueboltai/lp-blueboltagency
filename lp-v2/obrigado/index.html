    try{ guardado = JSON.parse(localStorage.getItem('bb-cookies') || 'null'); }catch(e){}
    var valido = guardado && guardado.v === 1 &&
                 (Date.now() - guardado.quando) < 15552000000;   /* 6 meses */
    var analise   = valido && guardado.analise   ? 'granted' : 'denied';
    var marketing = valido && guardado.marketing ? 'granted' : 'denied';

      ad_storage: marketing,
      ad_user_data: marketing,
      ad_personalization: marketing,
      analytics_storage: analise,
      functionality_storage: 'granted',
      security_storage: 'granted',
      wait_for_update: 500

  })();

@font-face{font-family:'Archia';src:url('../archia-regular.woff2') format('woff2'),url('../archia-regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(1.5rem,5vw,3rem);
  /* 38% e nao `center`: o Ricardo esta na metade esquerda do fotograma, e
     com `cover` num ecra estreito o centro cortava-o de fora. */
  background:#000 url('../img/obrigado-fundo.webp') 38% center/cover no-repeat;
  color:#fff;
  font-family:'Manrope',system-ui,sans-serif;
  text-align:center;
}
/* O veu nao tem de ser igual em toda a largura: o Ricardo esta a
   esquerda e o texto ao centro. Um gradiente na horizontal deixa entrar
   luz onde esta ele e fecha onde estao as letras — e assim ganha-se dos
   dois lados.

   Medido no proprio fotograma, contra o veu uniforme a 58% que estava
   aqui: a zona do Ricardo recebe 3x mais luz, e o pior pixel por tras do
   texto MELHORA de 6,7:1 para 8,8:1 contra o branco. A pagina original
   punha 77% uniforme, e com ela a foto quase desaparecia. */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(0,0,0,.28)   0%,
    rgba(0,0,0,.40)  16%,
    rgba(0,0,0,.62)  32%,
    rgba(0,0,0,.66)  44%,
    rgba(0,0,0,.66) 100%);
}
/* Num ecra em pe isto nao serve: o `cover` corta mais de 1000px de
   largura, o Ricardo passa a ocupar o fotograma todo e o texto assenta
   por cima dele. Sem lados para separar, volta a ser um veu uniforme. */
@media(max-width:700px){
  body{background-position:25% center}
  body::before{background:rgba(0,0,0,.62)}
}
.ob{position:relative;max-width:640px}
h1{

  letter-spacing:-.02em;line-height:1.1;margin:0 0 1.5rem;
}
.ob-sub{

  color:rgba(255,255,255,.88);margin:0 0 2.25rem;
}
.ob-redes{display:flex;gap:.75rem;justify-content:center}
.ob-redes a{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);
  color:#fff;text-decoration:none;
  transition:background .25s ease,transform .25s ease;
}
.ob-redes a:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}
.ob-redes svg{width:19px;height:19px;fill:currentColor}

<script>
/* A conversao dispara aqui, no carregamento: quem chega a esta pagina
   submeteu mesmo. Nao ha mensagens de iframe a adivinhar nem corridas
   com o redireccionamento. */
(function(){
  var eid = 'lead-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  function marcar(){
    if(window.fbq){
      fbq('track', 'Lead', {
        content_name: 'Diagnóstico gratuito de 30 minutos',
        content_category: 'formulario'
      }, { eventID: eid });
    }
  }
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'lead_enviada', event_id: eid });

  /* O pixel só existe se houve consentimento de marketing; a pagina
     anterior guardou a escolha no mesmo dominio, por isso le-se aqui. */
  try{
    var g = JSON.parse(localStorage.getItem('bb-cookies') || 'null');
    if(g && g.marketing && window.carregarPixel){ window.carregarPixel(); }
  }catch(e){}
  setTimeout(marcar, 400);
})();
</script>
